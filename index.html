<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои кредиты</title>
<style>
:root{--bg:#0b1220;--panel:#131c2e;--p2:#0f1727;--line:#243149;--txt:#e6edf7;--muted:#8b9bb4;--acc:#4f8cff;--grn:#2ecc8f;--red:#ff6b6b;--amb:#ffb454}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:14px;line-height:1.45;font-size:16px}
.wrap{max-width:620px;margin:0 auto}
h1{font-size:21px;margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.top{display:flex;gap:8px;flex-wrap:wrap}
.top .b{flex:1;min-width:100px;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.top .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.top .v{font-size:16px;font-weight:700;margin-top:3px}
.cash{display:flex;align-items:center;gap:8px;margin-top:10px}
.cash input{flex:1;padding:11px;background:var(--p2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:17px;font-weight:600}
.cash input:focus{outline:none;border-color:var(--acc)}
.after{font-size:13px;margin-top:8px;color:var(--muted)}
.pos{color:var(--grn)}.neg{color:var(--red)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row.paid{opacity:.5}
.chk{width:26px;height:26px;accent-color:var(--grn);flex-shrink:0}
.mid{flex:1;min-width:0}
.nm{font-size:15px;font-weight:600}
.meta{font-size:11px;color:var(--muted);margin-top:2px}
.dt{color:var(--amb)}
.done-tag{color:var(--grn);font-weight:600}
.bar{height:5px;background:var(--p2);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--amb));transition:width .3s}
.right{text-align:right;flex-shrink:0}
.st{font-size:15px;font-weight:700}
.sub{font-size:11px;color:var(--muted)}
.plus{background:var(--p2);border:1px solid var(--line);color:var(--acc);border-radius:6px;width:30px;height:30px;font-size:17px;cursor:pointer}
.inp{width:90px;padding:7px;background:var(--p2);border:1px solid var(--acc);border-radius:6px;color:var(--txt);font-size:14px;text-align:right}
.btn{width:100%;padding:13px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;background:var(--acc);color:#fff;margin-top:8px}
.btn.g{background:transparent;border:1px solid var(--line);color:var(--muted)}
.hint{font-size:11px;color:var(--muted);margin-top:8px;text-align:center}
.ob{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.ob:last-child{border-bottom:none}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;padding:10px;background:var(--p2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:15px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>💳 Мои кредиты</h1>

<div class="card">
  <div class="top">
    <div class="b"><div class="l">Долг всего</div><div class="v neg" id="tDebt">—</div></div>
    <div class="b"><div class="l">Платежей осталось</div><div class="v" style="color:var(--amb)" id="tPay">—</div></div>
    <div class="b"><div class="l">Осталось платить</div><div class="v" id="tMonths">—</div></div>
  </div>
  <div class="cash">
    <input id="cash" type="number" step="0.01" placeholder="Сколько денег на руках">
    <span style="color:var(--muted)">₽</span>
  </div>
  <div class="after" id="after"></div>
</div>

<div class="card">
  <div style="font-size:13px;color:var(--muted);margin-bottom:4px">Кредиты · галочка = внёс платёж</div>
  <div id="list"></div>
  <button class="btn g" onclick="newMonth()">🔄 Новый месяц (сбросить галочки)</button>
  <button class="btn g" onclick="toggleAdd()">+ Добавить долг</button>
  <div id="addBox" class="addrow hidden">
    <input id="newName" placeholder="Название">
    <input id="newSum" type="number" placeholder="Остаток">
    <button class="btn" style="width:auto;margin:0;padding:10px 14px" onclick="addDebt()">Ок</button>
  </div>
</div>

<div class="card">
  <div style="font-size:13px;color:var(--muted);margin-bottom:6px">Обязательные траты в месяц</div>
  <div id="oblig"></div>
</div>

<div class="hint">Данные хранятся в браузере. Не чисти данные сайта.</div>
</div>

<script>
const KEY='credits_v1';
const DEFAULT={
 cash:0,
 debts:[
  {n:'Сбер кредит',r:280474,p:9002.61,d:27,paid:0,pm:false},
  {n:'Сбер кредитка',r:123219,p:6206.83,d:31,paid:0,pm:false},
  {n:'Яндекс Пэй',r:99783,p:6903,d:3,paid:0,pm:false},
  {n:'Тинькофф кредитка',r:92959,p:7300,d:7,paid:0,pm:false},
  {n:'Райффайзен',r:20538,p:2213.82,d:17,paid:0,pm:false},
  {n:'Яндекс Сплит',r:10000,p:786,d:27,paid:0,pm:false},
  {n:'Кубышка',r:11280,p:null,d:null,paid:0,pm:false,note:'разово'},
  {n:'WB',r:0,p:null,d:null,paid:0,pm:false,free:true,note:'внеси сумму вручную'}
 ],
 oblig:[['Продукты',6000],['Квартира',7000],['Проезд',4000],['Кот',2000],['Интернет',300],['Связь',300]]
};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(JSON.stringify(DEFAULT));
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function f(n){return Math.round(n).toLocaleString('ru-RU')+' ₽'}
function f2(n){return n.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₽'}
const left=d=>Math.max(0,d.r-(d.paid||0));

function render(){
 let total=0, toPay=0;
 db.debts.forEach(d=>{total+=left(d); if(!d.pm&&d.p)toPay+=d.p});
 document.getElementById('tDebt').textContent=f(total);
 document.getElementById('tPay').textContent=f(toPay);
 const avg=db.debts.filter(d=>d.p).reduce((s,d)=>s+d.p,0)||1;
 document.getElementById('tMonths').textContent=(total/avg).toFixed(1)+' мес';

 const cash=parseFloat(document.getElementById('cash').value)||db.cash||0;
 const after=cash-toPay;
 document.getElementById('after').innerHTML='После всех платежей этого месяца останется: <b class="'+(after>=0?'pos':'neg')+'">'+f(after)+'</b>';

 document.getElementById('list').innerHTML=db.debts.map((d,i)=>{
   const pct=d.r?Math.min(100,(d.paid/d.r)*100):0;
   const meta=d.free
     ? '<span class="dt">своя сумма</span>'
     : d.p ? 'платёж '+f2(d.p)+' · <span class="dt">'+d.d+'-го</span>' : (d.note||'');
   const right=d.free
     ? '<input class="inp" type="number" step="0.01" placeholder="0" onchange="wbPay('+i+',this.value)">'
       +'<div class="sub">'+(d.r?f(left(d),'остаток'):'укажи долг')+'</div>'
     : '<div class="st '+(left(d)>0?'neg':'pos')+'">'+f(left(d))+'</div>'
       +(d.p?'<div class="sub">'+(d.pm?'<span class="done-tag">✓ оплачено</span>':f2(d.p)+' / '+d.d+'-го')+'</div>':'');
   return '<div class="row'+(d.pm?' paid':'')+'">'
     +(d.free?'':'<input type="checkbox" class="chk" '+(d.pm?'checked':'')+' onchange="pay('+i+')">')
     +'<div class="mid"><div class="nm">'+d.n+'</div><div class="meta">'+meta+'</div>'
     +(d.r?'<div class="bar"><i style="width:'+pct+'%"></i></div>':'')+'</div>'
     +'<div class="right">'+right
     +(d.p&&!d.free?'<button class="plus" onclick="extra('+i+')">+</button>':'')
     +'</div></div>';
 }).join('');

 const obTotal=db.oblig.reduce((s,o)=>s+o[1],0);
 document.getElementById('oblig').innerHTML=db.oblig.map(o=>'<div class="ob"><span>'+o[0]+'</span><span>'+f(o[1])+'</span></div>').join('')
   +'<div class="ob" style="font-weight:700;border-top:1px solid var(--line);padding-top:8px"><span>Итого быт</span><span class="neg">'+f(obTotal)+'</span></div>';
}

function pay(i){
 const d=db.debts[i];
 if(d.pm){ d.paid=Math.max(0,d.paid-d.p); d.pm=false; }
 else{ d.paid+=d.p; d.pm=true; }
 save();render();
}
function extra(i){
 const s=prompt('Внести сверх платежа (досрочно):');
 const v=parseFloat(s); if(!v||v<=0)return;
 db.debts[i].paid+=v; save();render();
}
function wbPay(i,v){
 const val=parseFloat(v); if(!val||val<=0)return;
 const d=db.debts[i];
 if(!d.r){ const t=prompt('Какой долг по WB?'); d.r=parseFloat(t)||0; }
 d.paid+=val; save();render();
}
function newMonth(){
 if(confirm('Снять все галочки? Долг останется текущим.')){
   db.debts.forEach(d=>d.pm=false); save();render();
 }
}
function toggleAdd(){document.getElementById('addBox').classList.toggle('hidden')}
function addDebt(){
 const n=document.getElementById('newName').value.trim();
 const r=parseFloat(document.getElementById('newSum').value);
 if(!n||!r)return alert('Заполни название и сумму');
 db.debts.push({n:n,r:r,p:null,d:null,paid:0,pm:false,free:true});
 save();toggleAdd();render();
}
document.getElementById('cash').addEventListener('input',e=>{db.cash=parseFloat(e.target.value)||0;save();render()});
document.getElementById('cash').value=db.cash||'';
render();
</script>
</body>
</html>
