<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Финансы 5/20</title>
<style>
body{margin:0;background:#f6efeb;color:#352e2b;font:14px system-ui,sans-serif}main{max-width:520px;margin:auto;padding:14px}h1{margin:0}.sub,.small,.note{font-size:11px;color:#8b7b74}.card{background:#fffaf7;border:1px solid #e9ddd7;border-radius:18px;padding:14px;margin:9px 0}.title{font-weight:750;margin-bottom:8px}.hero b{font-size:29px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.item{padding:9px 0;border-top:1px solid #e9ddd7}.item:first-child{border:0}.pay{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.tag{font-size:10px;padding:4px 7px;border-radius:9px;background:#ead5d1}.ok{background:#dce8df;color:#718c78}.done{opacity:.38}.check{width:23px;height:23px;accent-color:#c98286}.total{border-top:1px solid #e9ddd7;margin-top:8px;padding-top:8px;font-size:12px}.bar{height:7px;background:#eee1dc;border-radius:9px;overflow:hidden}.fill{height:100%;background:#c98286}button{border:0;border-radius:11px;padding:10px 13px;background:#c98286;color:white;font:inherit;font-weight:700}.ghost{background:#eee2dd;color:#352e2b}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select{width:100%;padding:10px;border:1px solid #e9ddd7;border-radius:10px;margin:4px 0 8px;font:inherit;box-sizing:border-box}.modal{display:none;position:fixed;inset:0;background:#352e2b55;align-items:end;padding:10px}.sheet{background:#fffaf7;border-radius:20px;padding:16px;width:min(520px,100%);box-sizing:border-box}.fact{padding:7px 0;border-top:1px solid #e9ddd7;font-size:12px}
.oprow{display:flex;align-items:center;justify-content:space-between;gap:8px}.remove{background:#eee2dd;color:#352e2b;padding:6px 9px;font-size:11px}.catmsg{font-weight:650}</style><main>
<h1>💰 Финансовый трекер</h1><div class=sub>27 августа 2026 · зарплата 79 000 ₽ · 5 и 20 числа</div>
<section class="card hero"><div class=small>💵 МОИ МЫШКИ</div><div class=row><b id=bal></b><button class=ghost onclick=balance()>Пожмякать</button></div><div class=bar><div class=fill id=bar></div></div><div class=small id=cover></div></section>
<section class=card><div class=title>🔴 20-е → 5-е</div><div id=p1></div><div class=total id=t1></div></section>
<section class=card><div class=title>🟡 5-е → 20-е</div><div id=p2></div><div class=total id=t2></div></section>
<section class=card><div class=title>🔵 Следующий цикл 20-е → 5-е</div><div id=p3></div><div class=total id=t3></div></section>
<section class=card><div class=title>🎯 Долги людям</div><div class=item><div class=row><b>Валя</b><span class=tag>400 000 ₽ · до 15.11</span></div></div><div class=item><div class=row><b>Леся</b><span class="tag ok">100 000 ₽ · последняя очередь</span></div></div><div class=item><div class=row><b>Т-Банк — кубышка</b><input class=check type=checkbox disabled></div><div class=note>Сумма скрыта · без аврального срока.</div></div></section>

<section class=card><div class=title>＋ Доход / − Расход</div><div class=two><button onclick="move('in')">＋ Доход</button><button class=ghost onclick="move('out')">− Расход</button></div><div id=facts></div></section>
<div id="catMood" class="note" style="text-align:center;padding:14px 4px 4px;font-size:12px"></div></main><div class=modal id=modal><div class=sheet><div class=row><h3 id=mt></h3><button class=ghost onclick=close()>Закрыть</button></div><div id=mb></div></div></div>
<script>
const KEY='finance_5_20_recurring';
const debts=[['sber','Сбер — кредит',27,9003],['split','Яндекс Split',27,786],['sbercc','Сбер — кредитка',31,6207],['ypay','Яндекс Pay — кредит',3,6903],['wb','WB — рассрочка',4,996],['tink','Тинькофф — кредитка',7,7300],['raif','Райффайзенбанк',17,2213.82]];
let s=JSON.parse(localStorage.getItem(KEY)||'null')||{bal:9425.97,paid:{},facts:[]};
const F=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(n)+' ₽';
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function days(y,m){return new Date(y,m+1,0).getDate()}
function dt(y,m,d){return new Date(y,m,Math.min(d,days(y,m)))}
function D(x){return String(x.getDate()).padStart(2,'0')+'.'+String(x.getMonth()+1).padStart(2,'0')}
function items(ds,de,me){let out=[];for(let i=0;i<debts.length;i++){let [id,name,day,pay]=debts[i];for(let k=-1;k<=2;k++){let x=dt(y,m+k,day);if(x>=ds&&x<=de)out.push({id:id+'_'+x.getFullYear()+'-'+x.getMonth(),name,dt:x,pay})}}return out.sort((a,b)=>a.dt-b.dt)}
let now=new Date(2026,7,27),y=now.getFullYear(),m=now.getMonth();
function card(d){let z=!!s.paid[d.id];return '<div class="item '+(z?'done':'')+'"><div class=pay><div><div class=row><b>'+d.name+'</b><span class="tag '+(z?'ok':'')+'">'+(z?'Котик мурчит':D(d.dt))+'</span></div><div class=small>Платёж: '+F(d.pay)+' · ежемесячно</div></div><input class=check type=checkbox '+(z?'checked':'')+' onchange="toggle(\''+d.id+'\','+d.pay+',this.checked)"></div></div>'}
function period(ds,de,p,t){let a=items(ds,de),u=a.filter(x=>!s.paid[x.id]),sum=u.reduce((q,x)=>q+x.pay,0);document.getElementById(p).innerHTML=a.map(card).join('');document.getElementById(t).innerHTML='Котик ждёт: <b>'+F(sum)+'</b> · после оплат: <b>'+F(s.bal-sum)+'</b>';return sum}
function render(){let a=period(dt(y,m,20),dt(y,m+1,5),'p1','t1'),b=period(dt(y,m+1,5),dt(y,m+1,20),'p2','t2'),c=period(dt(y,m+1,20),dt(y,m+2,5),'p3','t3');document.getElementById('bal').textContent=F(s.bal);document.getElementById('bar').style.width=Math.min(100,s.bal/Math.max(1,a)*100)+'%';document.getElementById('cover').textContent='До 05.09: нужно '+F(a)+' · не хватает '+F(Math.max(0,a-s.bal));document.getElementById('facts').innerHTML=s.facts.slice().reverse().map(x=>'<div class=fact>'+(x.t==='in'?'💵 +':'💸 −')+F(x.n)+' · '+x.c+'</div>').join('')||'<div class=note>Добавь расход 3 770 ₽ через «− Расход», если он ещё не внесён.</div>'}
function toggle(id,pay,on){if(on){s.paid[id]=1;s.bal-=pay}else{delete s.paid[id];s.bal+=pay}save();render()}
function removeFact(i){let x=s.facts[i];if(!x)return;s.bal+=x.t==='in'?-x.n:x.n;s.facts.splice(i,1);save();render();openM('🐭 Возврат мышки','<div class=catmsg>Мышка вернулась, мур-мур.</div><br><button onclick=close()>Закрыть</button>')}
function openM(t,b){mt.textContent=t;mb.innerHTML=b;modal.style.display='flex'}function close(){modal.style.display='none'}
function balance(){openM('💵 Деньги сейчас','<label>Доступно сейчас, ₽</label><input id=v type=number step=.01 value='+s.bal+'><button onclick=setbal()>Сохранить</button>')}
function setbal(){s.bal=Number(v.value)||0;save();close();render();openM(t==='in'?'🐭 Мышка пришла':'🐭 Потратил на мышку','<div class=catmsg>'+(t==='in'?'Мышка пришла, мур!':'Потратил на мышку — записала.')+'</div><br><button onclick=close()>Закрыть</button>')}
function move(t){openM(t==='in'?'＋ Доход':'− Расход','<label>Сумма, ₽</label><input id=v type=number step=.01 inputmode=decimal><label>Категория</label><select id=c>'+(t==='in'?['Зарплата','Подработка','Возврат','Другое']:['Еда','Транспорт','Жильё','Покупки','Развлечения','Другое']).map(x=>'<option>'+x+'</option>').join('')+'</select><button onclick="add(\''+t+'\')">Сохранить</button>')}
function add(t){let n=Number(v.value);if(!n)return;s.bal+=t==='in'?n:-n;s.facts.push({t,n,c:c.value});save();close();render()}
const catMoods=['🐾 Котик тихонько следит за мышками.', '😽 Всё хорошо, денежки под присмотром.', '🐈 Котик мурчит: ты отлично справляешься.', '🐾 Мышки любят порядок.', '😌 Котик доволен финансовой дисциплиной.', '🐱 Не спеши, котик. Всё постепенно.', '🐾 Одна мышка за другой — и всё получится.', '😽 Мур-мур. Сегодня всё под контролем.', '🐈 Котик проверил. Паниковать не надо.', '🐾 Бережём мышки вместе.', '😸 Мурр, хороший финансовый день.'];document.getElementById('catMood').textContent=catMoods[Math.floor(Math.random()*catMoods.length)];
render();
</script>
